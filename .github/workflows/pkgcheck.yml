name: pkgcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run pkgcheck
        uses: pkgcore/pkgcheck-action@v1
        with:
          # UnstatedIuse: false positive — проверка идёт только по нашим локальным
          # профилям pgr-min/pgr-min-musl (минимальные rootfs-профили без
          # features/prefix и арх-набора x86)
          args: --keywords=-RedundantVersion,-NonsolvableDepsInDev,-UnstatedIuse
